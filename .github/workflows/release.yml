name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish ServiceMonitor.App/ServiceMonitor.App.csproj -c Release -o publish

      - name: Pack
        run: vpk pack -u ServiceMonitor -v ${{ steps.version.outputs.version }} -o releases -p publish -f net10-x64-desktop -e ServiceMonitor.App.exe -i ServiceMonitor.App/Assets/app-icon.ico --packTitle "Service Monitor" --packAuthors "Tvoje Jméno"

      - name: Upload to GitHub Releases
        run: vpk upload github -o releases --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --publish --tag ${{ github.ref_name }}